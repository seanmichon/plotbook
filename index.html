<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plotbook</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A1A1A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Professional lighting and studio schematics.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#ECEEF2; --panel:#FFFFFF; --panel-2:#F5F6F8; --line:#D9DDE4; --line-2:#E7EAEF;
  --text:#14171D; --muted:#5B6372; --faint:#8A92A0;
  --acc:#2A4FE0; --acc-ink:#FFFFFF; --acc-soft:#E3E8FC; --danger:#C21F3A; --ok:#2F7A2F;
  --d-paper:#FFFFFF; --d-grid:#EDEFF3; --d-grid2:#D9DDE4;
  --d-ink:#14171C; --d-set:#5A6272; --d-grip:#353C4A; --d-lights:#14171C; --d-camera:#14171C;
  --d-distance:#0A6C97; --d-height:#2F7A2F; --d-meter:#C0430F; --d-power:#C8102E; --d-feed:#D96B00; --d-dmx:#1F7A6B; --d-rig:#5F7196; --d-notes:#14171C;
  --shadow:0 1px 2px rgba(20,24,30,.06),0 6px 20px rgba(20,24,30,.10);
  --f-ui:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1014; --panel:#171A20; --panel-2:#1D2129; --line:#2B303A; --line-2:#242933;
  --text:#E7E9ED; --muted:#9CA4B2; --faint:#6D7584;
  --acc:#7D95FF; --acc-ink:#0E1014; --acc-soft:#252C48; --danger:#FF6B7F; --ok:#6CC070;
  --d-paper:#14171C; --d-grid:#1D2128; --d-grid2:#2A303A;
  --d-ink:#E6E8EC; --d-set:#98A1B0; --d-grip:#BAC2CE; --d-lights:#E6E8EC; --d-camera:#E6E8EC;
  --d-distance:#4DB3E2; --d-height:#72C476; --d-meter:#F39157; --d-power:#FF5C70; --d-feed:#FFA23A; --d-dmx:#4FCBB4; --d-rig:#93A5CC; --d-notes:#E6E8EC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="sepia"]{
  --bg:#E6DEC9; --panel:#FBF4E2; --panel-2:#F2EAD4; --line:#D6CBAE; --line-2:#E3D9BF;
  --text:#2E2A20; --muted:#6B6350; --faint:#938A73;
  --acc:#8A5A1E; --acc-ink:#FFF8E9; --acc-soft:#F0E2C4; --danger:#A8321F; --ok:#4A6B2E;
  --d-paper:#FBF4E2; --d-grid:#EFE6CD; --d-grid2:#DFD2B2;
  --d-ink:#2E2A20; --d-set:#6B6350; --d-grip:#413B2C; --d-lights:#2E2A20; --d-camera:#2E2A20;
  --d-distance:#1C6480; --d-height:#3F6B2A; --d-meter:#A8521A; --d-power:#A8321F; --d-feed:#A86A12; --d-dmx:#1C6B5C; --d-rig:#6A6A86; --d-notes:#2E2A20;
  --shadow:0 1px 2px rgba(70,58,32,.10),0 6px 20px rgba(70,58,32,.14); color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0E1014; --panel:#171A20; --panel-2:#1D2129; --line:#2B303A; --line-2:#242933;
  --text:#E7E9ED; --muted:#9CA4B2; --faint:#6D7584;
  --acc:#7D95FF; --acc-ink:#0E1014; --acc-soft:#252C48; --danger:#FF6B7F; --ok:#6CC070;
  --d-paper:#14171C; --d-grid:#1D2128; --d-grid2:#2A303A;
  --d-ink:#E6E8EC; --d-set:#98A1B0; --d-grip:#BAC2CE; --d-lights:#E6E8EC; --d-camera:#E6E8EC;
  --d-distance:#4DB3E2; --d-height:#72C476; --d-meter:#F39157; --d-power:#FF5C70; --d-feed:#FFA23A; --d-dmx:#4FCBB4; --d-rig:#93A5CC; --d-notes:#E6E8EC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4); color-scheme:dark;
}

/* three neutral greys: a charcoal room, a mid-grey card, and a soft light grey */
:root[data-theme="greyd"]{
  --bg:#1A1A1A; --panel:#242424; --panel-2:#2D2D2D; --line:#3B3B3B; --line-2:#323232;
  --text:#EDEDED; --muted:#A8A8A8; --faint:#7A7A7A;
  --acc:#9BB2D8; --acc-ink:#15171A; --acc-soft:#30353D; --danger:#F2808F; --ok:#7FC083;
  --d-paper:#1F1F1F; --d-grid:#282828; --d-grid2:#363636;
  --d-ink:#EAEAEA; --d-set:#A3A3A3; --d-grip:#C4C4C4; --d-lights:#EAEAEA; --d-camera:#EAEAEA;
  --d-distance:#6FB8DF; --d-height:#80C483; --d-meter:#EE9A63; --d-power:#F26A7B; --d-feed:#F2A64A; --d-dmx:#5FC6B2; --d-rig:#A0AEC6; --d-notes:#EAEAEA;
  --shadow:0 1px 2px rgba(0,0,0,.34),0 8px 24px rgba(0,0,0,.44); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.4 var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
.top{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line-2);min-width:0}
.brand{font:700 17px/1 var(--f-cond);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex:none;border:0;background:none;color:var(--text);padding:2px 4px;margin-left:-4px;border-radius:6px;cursor:pointer}
.brand:hover{background:var(--panel-2)}
@media (max-width:520px){.brand .bt{display:none}}
.brand .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--text);position:relative}
.projbtn{display:flex;align-items:center;gap:6px;min-width:0;border:1px solid transparent;background:none;padding:6px 8px;border-radius:6px;font-weight:600;font-size:15px}
.projbtn:hover{background:var(--panel-2);border-color:var(--line)}
.projbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font:500 11px var(--f-mono);color:var(--faint);white-space:nowrap}
.spacer{flex:1}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 8px;border-radius:6px;border:1px solid transparent;background:none}
.ibtn:hover{background:var(--panel-2);border-color:var(--line)}
.ibtn:disabled{opacity:.35;cursor:default;background:none;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}

nav.pages{display:flex;gap:2px;overflow-x:auto;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
nav.pages::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;height:40px;padding:0 12px;border:0;background:none;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;flex:none}
.tab.on{color:var(--text);border-bottom-color:var(--text)}
.tab:hover{color:var(--text)}
.tab .tabmenu{display:inline-flex;padding:3px;border-radius:4px;margin-right:-6px}
.tab .tabmenu:hover{background:var(--panel-2)}
.tab.add{color:var(--acc)}
.tab.pick{gap:8px;font-weight:600;max-width:min(46vw,340px)}
.tab.pick>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.pick svg.i:last-child{color:var(--muted);transition:transform .15s}
.tab.pick.menuopen svg.i:last-child,.facebar #facePick.menuopen svg.i:last-child{transform:rotate(180deg)}
.tab .cnt{font:500 10px var(--f-mono);color:var(--muted);background:var(--panel-2);border-radius:999px;padding:1px 7px;flex:none}
.tab.tmenu{padding:0 8px;color:var(--muted)}
.tab.other{color:var(--faint);gap:5px}
.tab.other:hover{color:var(--text)}
.tab.tmenu:hover{color:var(--text)}
.facebar #facePick{gap:8px;font-weight:600;max-width:min(42vw,300px);overflow:hidden}
.facebar #facePick .cnt{font:500 10px var(--f-mono);background:rgba(127,127,127,.22);border-radius:999px;padding:1px 7px;flex:none}
.facebar #facePick svg.i:last-child{width:15px;height:15px;opacity:.8}
.facebar .rmf.solo{width:30px;height:34px;margin:0;border-radius:6px;color:var(--muted)}
.facebar .rmf.solo:hover{color:var(--text)}

main{display:grid;grid-template-columns:236px minmax(0,1fr) var(--sidew,300px);min-height:0}
main.hassplit{grid-template-columns:236px minmax(0,1fr) var(--sidew,300px) 380px}
main.full.hassplit{grid-template-columns:minmax(0,1fr) 380px}
.split{position:relative;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow:hidden;width:380px}
.split .sphead{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.split .sppick{flex:1;min-width:0;height:32px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);color:var(--text);font:inherit;font-size:12px;padding:0 6px}
.split .spbody{overflow:auto;padding:10px 12px 40px;min-height:0}
.split .spgrip{position:absolute;left:-3px;top:0;bottom:0;width:8px;cursor:col-resize}
.spblock{margin:0 0 14px}
.spcap{font:600 10px var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 4px}
.spsub{font-size:11px;color:var(--muted);margin:6px 0 2px}
.spplot svg{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.splist{margin:0 0 6px;padding-left:18px;font-size:12px}
.splist li{margin:2px 0}
.splist li.done{text-decoration:line-through;color:var(--muted)}
.spdim{color:var(--muted);font-size:11px}
.spnote{font-size:12px;color:var(--muted);white-space:pre-wrap;margin:0 0 10px}
.sppdf{display:flex;gap:6px;align-items:center;width:100%;text-align:left;margin:0 0 6px;padding:7px 9px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);color:var(--text);font:inherit;font-size:12px;cursor:pointer}
.spfig{margin:0 0 12px}
.spfig button{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.spfig img{width:100%;border-radius:8px;display:block}
.spfig figcaption{font-size:11px;color:var(--muted);margin-top:4px}
@media (max-width:900px){main.hassplit,main.full.hassplit{grid-template-columns:minmax(0,1fr)}.split{display:none}}
main.full{grid-template-columns:minmax(0,1fr)}
aside{background:var(--panel);min-height:0;overflow:auto;display:flex;flex-direction:column}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line);position:relative}
.sgrip{position:absolute;left:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:6;touch-action:none}
.sgrip:after{content:"";position:absolute;left:2px;top:0;bottom:0;width:3px;background:var(--acc);opacity:0;transition:opacity .12s}
.sgrip:hover:after,.sgrip.on:after{opacity:.5}
@media (max-width:900px){.sgrip{display:none}}
.sheethead{display:none}
.sec{padding:14px 16px;border-bottom:1px solid var(--line-2)}
.sec:last-child{border-bottom:0}
.eyebrow{font:600 11px/1 var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* library */
#lib>.libtop{position:sticky;top:0;z-index:3;background:var(--panel);padding-bottom:10px;border-bottom:1px solid var(--line-2)}
@media (max-width:900px){#lib>.sheethead{position:sticky;top:0;z-index:4}}
.search{width:100%;height:34px;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:0 10px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 2px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.chip.on{background:var(--text);color:var(--panel);border-color:var(--text)}
.libgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#libGrid{display:block}
.libgrp{border-bottom:1px solid var(--line-2)}
.libgrp:last-child{border-bottom:0}
.libhd{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:10px 4px;text-align:left;color:var(--text);font:600 12px var(--f-ui)}
.libhd:hover{color:var(--acc)}
.libhd svg.i{width:15px;height:15px;color:var(--faint);transition:transform .15s;flex:none}
.libgrp.open>.libhd svg.i{transform:rotate(90deg)}
.libhd>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libhd small{font:500 10px var(--f-mono);color:var(--muted);background:var(--panel-2);border-radius:999px;padding:1px 7px;flex:none}
.libgrp .libgrid{padding:0 0 10px}
.libsub{font:600 10px var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:4px 0 6px;padding-left:2px}
.libgrp.open>.libsub:first-of-type{margin-top:0}
.libitem{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 7px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);text-align:center;font-size:11px;line-height:1.15;color:var(--muted);touch-action:manipulation}
.libitem:hover{border-color:var(--acc);color:var(--text)}
.libitem svg{width:100%;height:44px;--c:var(--text);--d-paper:var(--panel)}
.libcat{font:600 10px var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px;grid-column:1/-1}

/* stage */
#stageWrap{position:relative;min-width:0;min-height:0;background:var(--d-paper);overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.tools{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;box-shadow:var(--shadow);z-index:2}
.tool{width:40px;height:40px;border:0;border-radius:6px;background:none;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tool:hover{color:var(--text);background:var(--panel-2)}
.tool.on{background:var(--text);color:var(--panel)}
.tsep{height:1px;background:var(--line);margin:3px 5px;flex:none}
.tool.nosnap{color:var(--danger)}
.tool.nosnap:hover{color:var(--danger);background:var(--panel-2)}
.tool.pickt{display:none}
@media (max-width:900px){
  #stageWrap .tools{flex-direction:row;align-items:center}
  #stageWrap .tools>.tool:not(.pickt),#stageWrap .tools>.tsep{display:none}
  #stageWrap .tool.pickt{display:flex;width:auto;gap:7px;padding:0 10px;font:600 12.5px var(--f-ui);color:var(--text)}
  #stageWrap .tool.pickt>span{white-space:nowrap}
  #stageWrap .tool.pickt svg.i:last-child{width:15px;height:15px;color:var(--muted);transition:transform .15s}
  #stageWrap .tool.pickt.menuopen svg.i:last-child{transform:rotate(180deg)}
}
/* on a phone both bars sit over the plot, so they shrink to leave more drawing room */
@media (max-width:700px){
  #stageWrap .tools{left:10px;top:10px;padding:2px;border-radius:7px}
  #stageWrap .tool{width:32px;height:32px;border-radius:5px}
  #stageWrap .tool svg.i{width:17px;height:17px}
  #stageWrap .tool.pickt{height:32px;gap:5px;padding:0 8px;font-size:11.5px}
  #stageWrap .tool.pickt svg.i:last-child{width:13px;height:13px}
  #stageWrap .facebar{right:10px;top:10px;padding:2px;border-radius:7px;max-width:calc(100% - 150px)}
  #stageWrap .facebar button{height:30px;padding:0 9px;font-size:11.5px;gap:5px}
  #stageWrap .facebar #facePick{gap:6px;max-width:min(38vw,220px)}
  #stageWrap .facebar #facePick .cnt{font-size:10px;padding:0 6px}
  #stageWrap .facebar #facePick svg.i:last-child{width:13px;height:13px}
  #stageWrap .facebar .rmf.solo{width:26px;height:30px}
  #stageWrap .facebar button svg.i{width:15px;height:15px}
  #stageWrap .facebar .rmf svg.i{width:12px;height:12px}
}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;box-shadow:var(--shadow);z-index:2;align-items:center}
.zoom .pct{font:500 11px var(--f-mono);color:var(--muted);min-width:44px;text-align:center}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--text);color:var(--panel);border-radius:8px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;font-size:13px;z-index:3;box-shadow:var(--shadow);max-width:calc(100% - 120px)}
.hint .hsel{height:30px;border-radius:6px;border:0;background:var(--panel);color:var(--text);padding:0 6px;font-weight:600;max-width:170px;margin-right:8px}
.hint .btn{height:30px;background:var(--panel);color:var(--text);border:0}
.ptog{position:absolute;top:50%;width:18px;height:56px;margin-top:-28px;border:1px solid var(--line);background:var(--panel);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;z-index:3;box-shadow:var(--shadow)}
.ptog:hover{color:var(--text);background:var(--panel-2)}
.ptog svg.i{width:14px;height:14px}
.ptog.l{left:0;border-left:0;border-radius:0 8px 8px 0}
.ptog.r{right:0;border-right:0;border-radius:8px 0 0 8px}
main.noL{grid-template-columns:minmax(0,1fr) var(--sidew,300px)}
main.noR{grid-template-columns:236px minmax(0,1fr)}
main.noL.noR,main.full.noL,main.full.noR{grid-template-columns:minmax(0,1fr)}
main.noL #lib,main.noR #side{display:none}
main.noL .tools{left:26px}
.facebar{position:absolute;right:12px;top:12px;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;box-shadow:var(--shadow);z-index:2}
.facebar button{border:0;background:none;height:34px;padding:0 12px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.facebar button.on{background:var(--text);color:var(--panel)}
.facebar{max-width:calc(100% - 84px);overflow-x:auto;scrollbar-width:none}
.facebar button{display:inline-flex;align-items:center;gap:6px}
.facebar .rmf{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-right:-6px;border-radius:4px;opacity:.75}
.facebar .rmf:hover{opacity:1;background:rgba(127,127,127,.3)}
.facebar .rmf svg.i{width:13px;height:13px;stroke-width:2.2}
.facebar button[data-face]:not([data-face="top"]){cursor:grab;touch-action:pan-x;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@keyframes pbJiggle{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes pbNudge{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
.facebar.reordering button[data-face]:not([data-face="top"]):not(.dragging){animation:pbJiggle .26s ease-in-out infinite}
.facebar.hinting button[data-face]:not([data-face="top"]){animation:pbNudge .6s ease-in-out 2}
.facebar button.dragging{transition:box-shadow .15s}

/* a flag's real size is "short\u00d7long"; which one you see on the plot depends on
   whether it's rigged as a cutter (long side across) or a sider (long side up) */
function flagSize(it){const m=/^(\d+(?:\.\d+)?)\s*[\u00d7x]\s*(\d+(?:\.\d+)?)$/.exec(String(it?.p?.size||''));
  if(!m)return null;const a=+m[1],b=+m[2];return{s:Math.min(a,b),l:Math.max(a,b)};}
const flagUp=it=>{const z=flagSize(it);return z?(it.p?.ori==='v'?z.l:z.s):Math.max(3,it.h||3);};
const flagAcross=it=>{const z=flagSize(it);return z?(it.p?.ori==='v'?z.s:z.l):Math.max(3,it.w||24);};
function syncFrameSize(it){if(!(it.t==='frame'||it.t==='overhead')||!it.p?.size)return;const old=it.p.size,nw=szFromW(it.w);if(nw===old)return;it.p.size=nw;if(it.label&&it.label.includes(old))it.label=it.label.split(old).join(nw);}
function szFromW(w){const ft=Math.round(w/12*2)/2;return `${ft}×${ft}`;}
function frameSize(it){return it.p?.size||szFromW(it.w);}
function typeName(it){
  if(it.t==='underlay')return 'Stage schematic (traced under the plot)';
  if(it.pre){const pr=PRE.find(p=>p.key===it.pre);if(pr)return pr.n+(it.p?.fin?` · ${it.p.fin}`:'');}
  if(it.t==='frame'||it.t==='overhead'){
    if(it.p?.mat==='neg'&&it.t==='frame')return `${frameSize(it)} Neg Fill`;
    return `${frameSize(it)} ${!it.faceOn&&(it.t==='overhead'||it.stand===2)?'Overhead':'Frame'}`;
  }
  if(it.t==='splitter'){const q=it.p||{},m=PRE.find(p=>p.t==='splitter'&&(p.p.n||3)===(+q.n||3)&&(p.p.inT||'edison')===(q.inT||'edison')&&(p.p.outT||p.p.inT||'edison')===(q.outT||q.inT||'edison'));return m?m.n:'Splitter';}

function initFaceDrag(){
  const bar=$('#facebar');let d=null;
  const movable=el=>el&&el.matches('button[data-face]')&&el.dataset.face!=='top';
  const place=dx=>{d.b.style.transform=`translateX(${dx-d.shift}px)${d.touch?' scale(1.07)':''}`;};
  const arm=()=>{if(!d)return;d.armed=d.started=true;d.x0=d.lx;try{bar.setPointerCapture(d.pid);}catch(_){}d.b.classList.add('dragging');bar.classList.add('reordering');place(0);try{navigator.vibrate?.(12);}catch(_){}};
  bar.addEventListener('contextmenu',e=>{if(e.target.closest('button[data-face]'))e.preventDefault();});
  bar.addEventListener('pointerdown',e=>{
    const b=e.target.closest('button[data-face]');
    if(!movable(b)||e.target.closest('[data-vmenu]')||e.button>0)return;
    const touch=e.pointerType!=='mouse';
    d={b,x0:e.clientX,sx:e.clientX,sy:e.clientY,lx:e.clientX,shift:0,started:false,armed:!touch,touch,pid:e.pointerId};
    if(touch)d.timer=setTimeout(arm,380);
  });
  bar.addEventListener('touchmove',e=>{if(d&&d.touch&&d.armed)e.preventDefault();},{passive:false});
  bar.addEventListener('pointermove',e=>{
    if(!d||e.pointerId!==d.pid)return;d.lx=e.clientX;
    if(d.touch&&!d.armed){if(Math.hypot(e.clientX-d.sx,e.clientY-d.sy)>8){clearTimeout(d.timer);d=null;}return;}
    const dx=e.clientX-d.x0;
    if(!d.started){if(Math.abs(dx)<6)return;d.started=true;try{bar.setPointerCapture(e.pointerId);}catch(_){}d.b.classList.add('dragging');}
    place(dx);
    const r=d.b.getBoundingClientRect(),cx=r.left+r.width/2;
    const nx=d.b.nextElementSibling,pv=d.b.previousElementSibling;
    if(movable(nx)){const nr=nx.getBoundingClientRect();if(cx>nr.left+nr.width/2){bar.insertBefore(nx,d.b);d.shift+=nr.width;place(dx);return;}}
    if(movable(pv)){const pr=pv.getBoundingClientRect();if(cx<pr.left+pr.width/2){bar.insertBefore(d.b,pv);d.shift-=pr.width;place(dx);}}
  });
  const end=e=>{
    if(!d||e.pointerId!==d.pid)return;clearTimeout(d.timer);const was=d.started;
    d.b.classList.remove('dragging');d.b.style.transform='';bar.classList.remove('reordering');d=null;
    if(!was)return;
    S.faceDragged=true;setTimeout(()=>S.faceDragged=false,0);
    const pg=PG(),order=[...bar.querySelectorAll('button[data-face]')].map(b=>b.dataset.face).filter(id=>id!=='top');
    const list=elevList(pg),cur=list.map(v=>v.id).join();
    if(order.join()!==cur){pushHist();pg.elevs=order.map(id=>list.find(v=>v.id===id)).filter(Boolean);scheduleSave();}
    renderFacebar();
  };
  bar.addEventListener('pointerup',end);bar.addEventListener('pointercancel',end);
}

const SMALLW=new Set(['on','with','of','and','or','the','a','to','per','in','for','from']);
function titleCase(str){return String(str).replace(/[A-Za-z][A-Za-z'\u2019]*/g,(w,i,s)=>{const prev=s[i-1]||'';

const IDB={
  db:null,
  open(){if(this.p)return this.p;this.p=new Promise((res,rej)=>{setTimeout(()=>rej(new Error('timeout')),4000);try{const r=indexedDB.open('plotbook',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs');};r.onsuccess=()=>{this.db=r.result;res(r.result);};r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));}catch(e){rej(e);}});return this.p;},
  tx(store,mode,fn){return this.open().then(d=>new Promise((res,rej)=>{const t=d.transaction(store,mode),s=t.objectStore(store);let out;const q=fn(s);if(q)q.onsuccess=()=>{out=q.result;};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}));},
  get(store,k){return this.tx(store,'readonly',s=>s.get(k));},
  put(store,k,v){return this.tx(store,'readwrite',s=>s.put(v,k));},
  del(store,k){return this.tx(store,'readwrite',s=>s.delete(k));},
  keys(store){return this.tx(store,'readonly',s=>s.getAllKeys());}
};

function backupReadme(q,jsonName,when){
  const n=t=>q.pages.filter(x=>x.type===t).length;
  const ph=q.pages.filter(x=>x.type==='photos').reduce((a,x)=>a+(x.photos||[]).length,0);
  const bits=[[n('plot'),'lighting plot'],[ph,'photo'],[n('gear'),'gear list'],[n('styles'),'Capture One style page']]
    .filter(([c])=>c).map(([c,w])=>`${c} ${w}${c>1?'s':''}`).join(' \u00b7 ');

${q.name||'Untitled shoot'}
Saved ${when.toLocaleString()}
${bits?bits+'\n':''}
WHAT THIS IS
The .plotbook.json file next to this note is the whole project:

async function projectPack(p){
  const q=clone(p);delete q.rev;const blobs={},styles={};let miss=0;
  for(const pg of q.pages){
    for(const ph of pg.photos||[]){const b=await refBlob('img',ph);if(b)blobs[ph.id]=await blobToDataURL(b);else miss++;}
    for(const f of pg.pdfs||[]){const b=await refBlob('pdf',f);if(b)blobs[f.id]=await blobToDataURL(b);else miss++;}
    if(pg.type==='styles')for(const st of pg.styles||[]){const t=S.styleText[st.id]??await styleText(st,p.id).catch(()=>null);if(t!=null)styles[st.id]=t;}
  }
  return{q,blobs,styles,miss};
}

  const base=safeName(q.name),jsonName=base+'.plotbook.json',when=new Date();
  const json=JSON.stringify({plotbook:1,savedAt:when.getTime(),project:q,blobs,styles});
  /* the backup travels as a folder: the project plus a note on how to open it */
  let ok;
  if(window.JSZip){

    const stamp=`${when.getFullYear()}-${String(when.getMonth()+1).padStart(2,'0')}-${String(when.getDate()).padStart(2,'0')}`;
    ok=await saveFile(`${base}-backup-${stamp}.zip`,await z.generateAsync({type:'blob'}));

}
async function openProjectFile(file){
  let text;
  if(/\.zip$/i.test(file.name||'')||file.type==='application/zip'){
    if(!window.JSZip){toast('The zip tool didn\u2019t load. Reload the page, or unzip the folder and pick the .plotbook.json inside.',5200);return;}
    try{const z=await JSZip.loadAsync(file);
      const f=Object.values(z.files).find(x=>!x.dir&&/\.(plotbook\.json|plotbook|json)$/i.test(x.name));
      if(!f){toast('That folder doesn\u2019t have a Plotbook project in it.',4200);return;}
      text=await f.async('string');
    }catch(_){toast('Couldn\u2019t read that folder.');return;}
  }else text=await file.text();
  let obj;try{obj=JSON.parse(text);}catch(_){toast('That file isn’t a Plotbook project.');return;}
  const proj=obj?.plotbook?obj.project:obj;if(!proj?.pages){toast('That file isn’t a Plotbook project.');return;}
  const blobs=obj.blobs||{},styles=obj.styles||{};
  let q=clone(proj);
  if(q.id&&S.projects[q.id]){
    const replace=await askConfirm(`Replace “${S.projects[q.id].name}”?`,'You already have this project here. Replace it with the version in this file, or keep both.','Replace',{safe:true,cancel:'Keep both'});
    if(!replace){const map={};q.id=uid();q.name=(q.name||'Project')+' (copy)';for(const pg of q.pages){pg.id=uid();for(const ph of pg.photos||[]){const n=uid();map[ph.id]=n;ph.id=n;}for(const f of pg.pdfs||[]){const n=uid();map[f.id]=n;f.id=n;}}for(const[o,n]of Object.entries(map))if(blobs[o]){blobs[n]=blobs[o];}for(const pg of q.pages)for(const cv of[pg,...(pg.elevs||[])])for(const it of cv.items||[])if(it.t==='underlay'&&map[it.p?.img])it.p.img=map[it.p.img];}
  }
  if(!q.id)q.id=uid();
  toast('Opening project…',8000);
  for(const pg of q.pages){
    for(const x of[...(pg.photos||[]),...(pg.pdfs||[])]){const du=blobs[x.id];if(!du)continue;const b=await dataURLToBlob(du);const isPdf=(b.type||'').includes('pdf');
      if(S.assets){try{const r=await S.assets.upload(b,{type:b.type||(isPdf?'application/pdf':'image/jpeg')});x.asset=r.id;continue;}catch(_){}}
      delete x.asset;const u=URL.createObjectURL(b);if(isPdf)S.localPdfs[x.id]=u;else S.localImgs[x.id]=u;putLocalBlob(x.id,b);}
    if(pg.type==='styles')for(const st of pg.styles||[]){if(styles[st.id]==null)continue;S.styleText[st.id]=styles[st.id];if(S.mode==='db')S.db.doc(`${S.root}projects/${q.id}/styles/${st.id}`).set({text:styles[st.id],filename:st.filename||st.name||''}).catch(()=>{});}
  }
  q.lastBackup=Date.now();addProject(q);toast(`Opened “${q.name}”.`,3000);
}

/* ---------- snapping ---------- */
function snapPoint(w,from,skipId){
  if(S.nosnap){S.snapPt=null;return{x:Math.round(w.x),y:Math.round(w.y)};}
  const pg=CV(),thr=16/V().k;let best=null,bd=thr;
  let p={x:w.x,y:w.y};
  if(from){const dx=p.x-from.x,dy=p.y-from.y;if(Math.abs(dy)<Math.abs(dx)*.06)p.y=from.y;else if(Math.abs(dx)<Math.abs(dy)*.06)p.x=from.x;}
  for(const it of pg.items){
    if(it.id===skipId||pg.layers[it.layer]===false)continue;
    if(it.k==='sym'){
      const d=Math.hypot(w.x-it.x,w.y-it.y)*.7;if(d<bd){bd=d;best={x:it.x,y:it.y};}
      if(isFx(it)&&!CENTER_FX.has(it.t)){const q=measAnchor(it),db=Math.hypot(w.x-q.x,w.y-q.y)*.5;if(db<bd){bd=db;best=q;}}
      for(const sg of symSegs(it)){

        if(q.d<bd){bd=q.d;best={x:q.x,y:q.y};}

    }else if(it.k==='meas'||it.k==='arrow'){for(const[x,y]of[[it.x1,it.y1],[it.x2,it.y2]]){const d=Math.hypot(w.x-x,w.y-y);if(d<bd){bd=d;best={x,y};}}}
  }
  S.snapPt=best;
  return best?{x:r1(best.x),y:r1(best.y)}:{x:Math.round(p.x),y:Math.round(p.y)};
}

/* cables snap to the outside of boxes, lights and gear, never into them */
const CABLE_BOX=new Set(['power','feed','lights','camera']);
function snapCable(w,from,skipId){
  if(S.nosnap){S.snapPt=null;return{x:Math.round(w.x),y:Math.round(w.y)};}
  const pg=CV(),thr=16/V().k,pad=2.5;let p={x:w.x,y:w.y};
  if(from){const dx=p.x-from.x,dy=p.y-from.y;if(Math.abs(dy)<Math.abs(dx)*.08)p.y=from.y;else if(Math.abs(dx)<Math.abs(dy)*.08)p.x=from.x;}
  let best=null,bd=thr,inBest=null,inArea=Infinity;

    if(it.id===skipId||pg.layers[it.layer]===false)continue;
    if(it.k==='sym'&&CABLE_BOX.has(it.layer)&&!NO_OWN.has(it.t)){
      const l=toLocalPt(it,p.x,p.y),hw=it.w/2,hh=it.h/2,inside=Math.abs(l.x)<hw&&Math.abs(l.y)<hh;

      else{q={x:clamp(l.x,-hw,hw),y:clamp(l.y,-hh,hh)};const ox=Math.abs(l.x)-hw,oy=Math.abs(l.y)-hh;n=ox>oy?{x:Math.sign(l.x),y:0}:{x:0,y:Math.sign(l.y)};}

function itemBounds(it){let pts=[];
  if(it.k==='sym'||it.k==='text'){const b=itemBox(it);for(const[a,c]of[[-1,-1],[1,-1],[1,1],[-1,1]])pts.push(toWorldPt(it,a*b.w/2,c*b.h/2));}

  if(it.k==='power'||it.k==='swall'){const p=it.pts||[];if(p.length===1)return segHitsBox(p[0][0],p[0][1],p[0][0],p[0][1],x0,y0,x1,y1);for(let i=1;i<p.length;i++)if(segHitsBox(p[i-1][0],p[i-1][1],p[i][0],p[i][1],x0,y0,x1,y1))return true;return false;}

function snapToRig(it){
  if(S.nosnap)return;
  const cv=CV();if(!cv||it.k!=='sym')return;const thr=Math.max(6,10/V().k);
  if(isElev()){if(!it.hang||it.hang===2||it.mount||lightMount(it)==='grid')return;const bh=bbHalf(it)[1];let best=null;
    for(const g of cv.items){if(g.t!=='riggridSide'&&g.t!=='ceiling'&&g.t!=='rail')continue;if(cv.layers[g.layer]===false)continue;const py=g.t==='ceiling'?g.y+g.h/2:g.y;const half=g.w/2;if(it.x<g.x-half-6||it.x>g.x+half+6)continue;const want=py+14+bh;if(Math.abs(it.y-want)<thr*1.5&&(!best||Math.abs(it.y-want)<Math.abs(it.y-best)))best=want;}
    if(best!=null)it.y=Math.round(best);return;}

  for(const g of cv.items){if(g.t!=='riggrid'||cv.layers[g.layer]===false)continue;const sp=Math.max(6,+(g.p?.sp)||60);const l=toLocalPt(g,it.x,it.y);
    if(l.x<-g.w/2-thr||l.x>g.w/2+thr||l.y<-g.h/2-thr||l.y>g.h/2+thr)continue;
    const nx=clamp(Math.round((l.x+g.w/2)/sp)*sp-g.w/2,-g.w/2,g.w/2),ny=clamp(Math.round((l.y+g.h/2)/sp)*sp-g.h/2,-g.h/2,g.h/2);

}
function remindMeasures(origs){

  const hit=ms.filter(m=>moved.some(o=>near(o,m.x1,m.y1)||near(o,m.x2,m.y2)));

function dupItems(list){

function downscale(file,max=2400){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.86);};im.onerror=()=>{URL.revokeObjectURL(u);rej();};im.src=u;});
}

/* the ordinary browser way to hand someone a file, for viewers the host won't grant a download to */
function dlPlain(filename,data){
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:/\.json$/i.test(filename)?'application/json':'application/octet-stream'});
    const u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=filename;a.rel='noopener';a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{try{URL.revokeObjectURL(u);a.remove();}catch(_){}} ,4000);
    return true;
  }catch(_){return false;}
}
async function saveFile(filename,data){
  if(!S.downloads){
    if(dlPlain(filename,data)){toast('Check your downloads folder for '+filename+'.',4200);return true;}
    toast('This browser wouldn’t let the page save a file.',5200);return false;}
  try{await S.downloads.save({filename,data});return true;}
  catch(e){const c=e?.code;
    if(c==='declined')return false;
    /* anything other than "the person said no" gets the ordinary browser route */
    if(c!=='rate_limited'&&dlPlain(filename,data)){toast('Check your downloads folder for '+filename+'.',4200);return true;}
    toast(c==='rate_limited'?'A download is already waiting for your OK.'
      :c==='too_large'?'That file is too big for this browser to save here. Try removing some photos first.'
      :c==='rejected_extension'||c==='extension_not_enabled'?'This browser won’t save that kind of file. Tell Sean — it’s a bug, not you.'
      :'That download didn’t go through.',4600);
    return false;}
}

const pairKind=pg=>PAIRABLE[pg?.type]||null;
const isChildPage=pg=>!!pg&&pg.type!=='plot';
function pairOf(pg){const p=PJ();if(!pg||!p)return null;
  if(pg.pair)return (p.pages||[]).find(x=>x.id===pg.pair)||null;
  return (p.pages||[]).find(x=>x.pair===pg.id)||null;}
const pairsOf=pg=>{const p=PJ();return pg&&p?(p.pages||[]).filter(x=>x.pair===pg.id):[];};
function setPair(pg,id){
  const p=PJ();if(!p||!pg)return;pushHist();
  if(isChildPage(pg)){if(id)pg.pair=id;else delete pg.pair;}
  else{/* set from the plot's own panel: the page we picked points back at this plot */
    const o=p.pages.find(x=>x.id===id);if(o)o.pair=pg.id;}
  scheduleSave();renderDoc();renderTabs();
}
const PAIR_LABEL={gear:'Setup or schematic this gear list is for',photos:'Setup these photos belong to',styles:'Setup these styles belong to'};
function pairHTML(pg){

      +(kids.length?`<p class="muted" style="font-size:11.5px;margin:-4px 0 10px">Paired: ${kids.map(x=>esc(x.name)).join(', ')}. These show in the tabs only while this setup is picked.</p>`:'');

const pdfUrl=f=>f.asset?'/_blob/'+f.asset:(S.localPdfs||{})[f.id]||'';
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';

  const list=pg.pdfs||[],can=S.assets||S.mode==='local',imp=pg.type==='gear';
  let h=`<div class="gpdfs"><div class="gpdfh"><span class="eyebrow" style="margin:0">${esc(o.title||'Gear list PDFs')}</span>${can?`<label class="btn sm upl">${I('plus')}Upload PDF<input type="file" accept="application/pdf,.pdf" multiple data-upload="gearpdf"></label>`:''}</div>`;
  if(!list.length)h+=`<p class="muted" style="font-size:12px;margin:6px 0 0">${esc(o.hint||'Attach a rental house or vendor gear list as a PDF.')}</p>`;
  else h+=list.map(f=>{const u=pdfUrl(f);return `<div class="gpdf">${I('file')}<div class="gpn"><b>${esc(f.name)}</b><small>${esc(fmtSize(f.size||0))}${u?'':' · not available on this device'}</small></div>${u?`${imp?`<button class="btn sm" type="button" data-gpdfimp="${f.id}" title="Read this PDF and add its gear to the sections below">${I('list')}Import</button>`:''}<button class="btn sm pri" type="button" data-gpdfview="${f.id}">${I('eye')}View</button><button class="btn sm" type="button" data-gpdfdl="${f.id}">${I('download')}</button>`:''}<button class="btn sm danger" type="button" data-gpdfrm="${f.id}" aria-label="Remove ${esc(f.name)}">${I('trash')}</button></div>`;}).join('');
  return h+'</div>';

async function uploadGearPdfs(files){
  const pg=PG(),pid=S.pid;
  for(const f of files){
    if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf'){toast(`${f.name} isn’t a PDF.`,3600);continue;}
    if(f.size>15*1024*1024){toast(`${f.name} is over 15 MB, so it can’t be stored here.`,4200);continue;}
    toast(`Uploading ${f.name}…`,8000);
    try{
      const rec={id:uid(),name:f.name,size:f.size,added:Date.now()};
      if(S.assets){const r=await S.assets.upload(f,{type:'application/pdf'});rec.asset=r.id;}
      else{S.localPdfs=S.localPdfs||{};S.localPdfs[rec.id]=URL.createObjectURL(f);putLocalBlob(rec.id,f);}
      if(S.pid!==pid)return;pushHist();(pg.pdfs=pg.pdfs||[]).push(rec);scheduleSave();renderDoc();toast(`${f.name} attached.`);
    }catch(e){toast(e?.code==='quota_or_state'?'File storage is full. Remove some photos or PDFs first.':`Couldn’t upload ${f.name}.`,4000);}
  }
}
async function gearPdfClick(pg,t){

  const vw=t.closest('[data-gpdfview]');if(vw){const f=(pg.pdfs||[]).find(x=>x.id===vw.dataset.gpdfview);if(f)openPdfViewer(f);return true;}
  const dl=t.closest('[data-gpdfdl]'),rm=t.closest('[data-gpdfrm]');if(!dl&&!rm)return false;
  const f=(pg.pdfs||[]).find(x=>x.id===(dl||rm).dataset[dl?'gpdfdl':'gpdfrm']);if(!f)return true;
  if(dl){try{const b=await (await fetch(pdfUrl(f))).blob();await saveFile(f.name,b);}catch(_){toast('Couldn’t download that PDF.',3200);}return true;}
  if(await askConfirm(`Remove “${f.name}”?`,'It will be taken off this gear list. You can undo this right after.','Remove')){pushHist();pg.pdfs=pg.pdfs.filter(x=>x!==f);scheduleSave();renderDoc();}
  return true;
}

/* ---------- import a gear list PDF into the sections ---------- */
const GEAR_GROUPS={Lighting:['Strobe','Continuous'],Grip:['Rags & Flags','Frames','Stands','Rigging']};
async function pdfText(f){
  const lib=await loadPdfJs(),buf=await(await fetch(pdfUrl(f))).arrayBuffer(),doc=await lib.getDocument({data:new Uint8Array(buf)}).promise,out=[];
  for(let n=1;n<=doc.numPages;n++){const pgp=await doc.getPage(n),tc=await pgp.getTextContent(),rows=[];
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const y=Math.round(it.transform[5]),x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<=3);if(!r){r={y,parts:[]};rows.push(r);}r.parts.push({x,w:it.width||0,s:it.str});}
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){r.parts.sort((a,b)=>a.x-b.x);let line='',end=null;for(const p of r.parts){if(end!=null)line+=p.x-end>12?'   ':(p.x-end>1.5?' ':'');line+=p.s;end=p.x+p.w;}out.push(line.trim());}
    out.push('');}
  try{doc.destroy();}catch(_){}
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function guessSection(name){const n=name.toLowerCase();
  if(/stinger|cable|bates|cam-?lok|distro|lunch ?box|gang ?box|splitter|3-?fer|2-?fer|generator|genny|putt|dimmer|socapex|edison|extension/.test(n))return['Electric',''];
  if(/tape|gel|gaff|clothespin|c-?47|sash|black wrap|cinefoil|dulling|batter|bulb|expend/.test(n))return['Expendables',''];
  if(/laptop|monitor|tether|capture|drive|ssd|card|computer|ipad|dit|cart|camera body|lens/.test(n))return['Digital',''];
  if(/flag|floppy|solid|net|scrim|cutter|duvetyne|rag|silk|ultrabounce|griff|muslin|diffusion/.test(n))return['Grip','Rags & Flags'];
  if(/frame|butterfly|overhead|\d+ ?x ?\d+/.test(n))return['Grip','Frames'];
  if(/stand|combo|roller|wind ?up|c-?stand|baby|junior|mombo/.test(n))return['Grip','Stands'];
  if(/speed ?rail|clamp|cardellini|mafer|menace|boom|pipe|chain|rigging|sandbag|shot ?bag|apple box|pancake|cup ?block|wedge/.test(n))return['Grip','Rigging'];
  if(/hmi|\bled\b|skypanel|arri|kino|fresnel|tungsten|asteras|titan|aputure|nanlite|continuous|joker|m18|m40|\bpar\b/.test(n))return['Lighting','Continuous'];
  if(/profoto|broncolor|elinchrom|strobe|pack|head|flash|\bb1\b|\bb10\b|\bd2\b|pro-?\d|siros|scoro|para|octa|softbox|beauty dish|reflector|grid|umbrella|magnum|zoom/.test(n))return['Lighting','Strobe'];
  return['Production',''];}
function basicParse(text){
  const out=[];let orderDays=null;const od=text.match(/(\d{1,3})\s*(?:day|days)\b/i);if(od)orderDays=+od[1];
  for(const raw of text.split('\n')){const l=raw.replace(/\s{2,}/g,'  ').trim();if(!l||l.length<3)continue;
    if(/sub-?total|\btotal\b|\btax\b|insurance|deposit|invoice|quote #|phone|email|@|www\.|terms|signature|page \d|delivery|pick ?up|discount|balance/i.test(l))continue;
    const m=l.match(/^(\d{1,3})\s*(?:x|×|ea\.?|pcs?)?\s+(.+)$/i)||l.match(/^(.+?)\s+(?:x|×|qty:?)\s*(\d{1,3})\b/i);if(!m)continue;
    let qty,name;if(/^\d/.test(m[1])){qty=+m[1];name=m[2];}else{name=m[1];qty=+m[2];}
    let days=null;const dm=name.match(/(\d{1,3})\s*(?:days?|d)\b/i);if(dm){days=+dm[1];name=name.replace(dm[0],'');}
    if(days==null){const cm=name.match(/\s(\d{1,3})\s+\$?\d[\d,]*\.\d{2}/);if(cm){days=+cm[1];name=name.slice(0,cm.index);}}
    name=name.replace(/\$?\s?\d{1,3}(?:,\d{3})*\.\d{2}/g,'').replace(/\s{2,}\d+(\.\d+)?\s*$/,'').replace(/\s{2,}/g,' ').replace(/[\s\-–|]+$/,'').trim();
    if(!name||name.length<2||/^\d+$/.test(name))continue;const[section,group]=guessSection(name);
    out.push({section,group,qty:qty||1,item:name,days:days??orderDays,notes:''});}
  return out;
}
async function aiParse(text,pg,signal){
  const smp=await useCap('sample');if(!smp)return null;
  const secs=[...new Set([...GEAR_SECTIONS.map(s=>s[0]),...(pg.sections||[]).map(s=>s.name)])];
  const prompt=['You are reading a film / photo rental gear list (plain text pulled from a PDF). Extract every piece of equipment that was ordered.',
    'Reply with ONLY JSON in this shape:',
    '{"days": number|null, "items": [{"section": string, "group": string, "qty": number, "item": string, "days": number|null, "notes": string}]}',
    'Rules:',
    '- "section" must be one of: '+secs.map(s=>JSON.stringify(s)).join(', ')+'.',
    '- "group": for Lighting use "Strobe" or "Continuous"; for Grip use "Rags & Flags", "Frames", "Stands" or "Rigging"; otherwise "".',
    '- "item": the equipment name, cleaned up. No prices, no part or SKU numbers unless they are how the item is known.',
    '- "qty": how many were ordered (1 if not stated).',
    '- "days": rental days for that line if stated, otherwise the order\'s rental length if stated, otherwise null. Top-level "days" is the order\'s rental length if stated.',
    '- "notes": a very short detail only if it matters on set (e.g. "with sock", "20° grid"), else "".',
    '- Leave out prices, rates, subtotals, taxes, insurance, loss and damage, delivery or labor charges, discounts, addresses, contacts, terms and anything that is not gear.',
    '- Keep kits as one line unless the list breaks them into separate items with their own quantities.',
    'Gear list text:','<<<',text.slice(0,45000),'>>>'].join('\n');
  const r=await smp.json(prompt,{signal,modelTier:'default'});
  const items=Array.isArray(r)?r:Array.isArray(r?.items)?r.items:[];
  const od=r&&!Array.isArray(r)&&r.days!=null&&!isNaN(+r.days)?+r.days:null;
  return items.map(x=>({section:String(x.section||'Production'),group:String(x.group||''),qty:Math.max(1,parseInt(x.qty)||1),item:String(x.item||'').trim(),days:x.days!=null&&x.days!==''&&!isNaN(+x.days)?+x.days:od,notes:String(x.notes||'').trim()})).filter(x=>x.item);
}
async function importGearPdf(pg,f){

/* ---------- print ---------- */
async function printDoc(){
  const p=PJ();if(!p)return;const inc=await askExport(p,'Print');if(!inc)return;let h='';
  const head=t=>`<div class="pph"><div><h1>${esc(p.name)}</h1><h2>${esc(t)}</h2></div><div style="text-align:right;font-size:9pt;color:#555">${esc([p.client,fmtDate(p.date),p.location].filter(Boolean).join(' · '))}<br>${esc([p.photographer&&'Photographer: '+p.photographer,...crewLine(p)].filter(Boolean).join(' · '))}</div></div>`;
  for(const pg of p.pages){
    if(inc[PGKIND(pg)]===false)continue;
    if(pg.type==='plot'){
      const views=[{title:pg.topName?pg.name+' · '+pg.topName:pg.name,cv:pg,top:true,leg:pg}].concat(elevList(pg).filter(v=>v.items.length).map(v=>({title:pg.name+' · '+viewLabel(pg,v),cv:v,top:v.kind==='top',leg:{items:v.items,notes:'',layerMeta:pg.layerMeta,legOff:pg.legOff}})));
      for(const V2 of views){
        if(!V2.top){h+=`<section class="pp">${head(V2.title)}<div>${plotSVGString(V2.cv,0,true).svg}</div></section>`;continue;}
        if(!inc.legend){h+=`<section class="pp">${head(V2.title)}<div>${plotSVGString(V2.cv,0,true).svg}</div></section>`;continue;}
        const leg=legendData(V2.leg).map(g=>`<div class="grp">${esc(g.group)}</div>`+g.items.map(it=>`<div class="it${g.compact?' cp':''}">${it.title?`<b>${esc(it.title)}</b>`:''}${it.lines.map(l=>`<div>${esc(l)}</div>`).join('')}</div>`).join('')).join('');
        h+=`<section class="pp">${head(V2.title)}<div class="ppb"><div>${plotSVGString(V2.cv,0,true).svg}</div><div class="ppl">${leg}</div></div></section>`;
      }
    }else if((pg.type==='photos'||pg.type==='schematic')&&(pg.photos||[]).length){
      h+=`<section class="pp">${head(pgTitle(pg))}<div class="ppg">${pg.photos.map(ph=>`<figure><img src="${esc(imgSrc(ph))}" alt=""><figcaption>${ph.title?`<b>${esc(ph.title)}</b><br>`:''}${esc(ph.caption)}</figcaption></figure>`).join('')}</div></section>`;
    }else if(pg.type==='gear'&&(pg.text||(pg.pdfs||[]).length||(pg.sections||[]).some(s=>s.groups.some(g=>g.items.length)))){
      h+=`<section class="pp">${head(pgTitle(pg))}${pg.text?`<p style="white-space:pre-wrap">${esc(pg.text)}</p>`:''}${(pg.pdfs||[]).length?`<p><b>Attached gear list PDFs:</b> ${pg.pdfs.map(f=>esc(f.name)).join(', ')}</p>`:''}${gearLines(pg).filter(s=>s.groups.some(g=>g.items.length)).map(s=>`<h3 style="font:700 12pt var(--f-cond);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid #ccc;margin:12pt 0 4pt">${esc(s.h)}</h3>`+s.groups.filter(g=>g.items.length).map(g=>(g.name?`<div style="font-weight:600;color:#555;margin:6pt 0 2pt">${esc(g.name)}</div>`:'')+`<table class="pt">${g.items.map(i=>`<tr><td style="width:14pt">${i.done?'☑':'☐'}</td><td>${esc(i.t)}</td><td style="color:#555">${esc(i.n)}</td></tr>`).join('')}</table>`).join('')).join('')}</section>`;
    }else if(pg.type==='styles'&&pg.styles.length){
      h+=`<section class="pp">${head(pg.name)}<table class="pt"><tr><th>Style</th><th>File</th><th>Applies to</th><th>Notes</th></tr>${pg.styles.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.filename)}</td><td>${esc(s.applies)}</td><td>${esc(s.notes)}</td></tr>`).join('')}</table></section>`;
    }
  }
  $('#printRoot').innerHTML=h;
  setTimeout(()=>{try{window.print();}catch(e){toast('Printing is blocked here. Download the PDF and print that instead.',4200);}},250);
}
window.addEventListener('afterprint',()=>{$('#printRoot').innerHTML='';});

function readVal(el){
  if(el.type==='checkbox')return el.checked;
  if(el.type==='number'||el.type==='range'){if(el.value==='')return '';let n=parseFloat(el.value);if(isNaN(n))return '';return el.dataset.len?fromDisp(n):n;}
  return el.value;
}

      const o=$('#opval');if(o)o.textContent=Math.round(+it.p.op*100)+'%';renderDiagram();scheduleSave();return;}
    if(f==='p.blend'){it.p=it.p||{};if(v==='normal')delete it.p.blend;else it.p.blend=v;renderDiagram();scheduleSave();return;}
    if(f==='uw'){if(!(v>=1))return;const k=v/it.w;it.w=Math.round(v);it.h=Math.max(1,Math.round(it.h*k*10)/10);renderDiagram();renderOverlay();scheduleSave();return;}
    if(f==='gridsp'||f==='gridsp2'){const n=parseFloat(v);if(!(n>0))return;it.p=it.p||{};
      const inches=UNITS==='metric'?n/.0254:n*12;
      if(f==='gridsp')it.p.sp=inches;else it.p.sp2=inches;
      if(+it.p.sp2===+it.p.sp)delete it.p.sp2;
      renderDiagram();scheduleSave();return;}
    if(f==='labrot'){const n=parseFloat(v);it.cr=isFinite(n)?((n%360)+360)%360:0;if(!it.cr)delete it.cr;renderDiagram();scheduleSave();return;}
    if(f==='tagH'||f==='tagM'){const k=f==='tagH'?'height':'meter';it.tagOff=it.tagOff||{};if(v)delete it.tagOff[k];else it.tagOff[k]=true;if(!Object.keys(it.tagOff).length)delete it.tagOff;renderDiagram();renderLayers();scheduleSave();return;}
    if(f==='showlab'){setLabelShown(it,v);renderDiagram();renderLayers();scheduleSave();return;}
    if(f==='wft'||f==='hft'){const n=parseHeight(v);if(n==null||!(n>=1))return;it[f==='wft'?'w':'h']=Math.round(n);renderDiagram();renderOverlay();scheduleSave();return;}
    if(f==='wallh'||f==='gridh'){const hh=parseHeight(v);if(hh==null||!(hh>0))return;if(f==='wallh'){it.h=Math.round(hh);it.y=-Math.round(hh/2);}else it.y=-Math.round(hh);syncHeight(it,fmtLen(hh));renderDiagram();renderOverlay();scheduleSave();return;}
    if(f==='orient'||f==='fin'){pushHist();if(f==='orient'){it.p.orient=v;const ms=modSize(it,isElev());if(ms){it.w=Math.round(ms.w*10)/10;it.h=Math.round(ms.h*10)/10;}}else{const old=it.p.fin;it.p.fin=v;if(v==='Strobe')it.p.src='strobe';else if(['HMI','Tungsten','LED'].includes(v))it.p.src='continuous';if(it.label&&old&&it.label.endsWith(' '+old))it.label=it.label.slice(0,-old.length)+v;}renderDiagram();renderOverlay();scheduleSave();renderInspector();return;}
    if(f==='mount'){it.mount=v;if(v==='grid')snapToGridMount(it);if(v==='stand'&&it.y>-2)it.y=-72;renderDiagram();renderOverlay();scheduleSave();renderInspector();return;}
    if(f==='sizeLock'){it.sizeLock=v;renderOverlay();renderInspector();scheduleSave();return;}
    if((f==='w')&&(it.t==='frame'||it.t==='overhead')&&it.p?.size){const old=it.p.size,nw=szFromW(v);it.p.size=nw;if(it.label&&it.label.includes(old))it.label=it.label.split(old).join(nw);}
    setField(it,f,v);
    if(f==='w'&&LIB[it.t]?.hFromW){const nh=Math.round(LIB[it.t].hFromW(+it.w||1)),a=(it.rot||0)*Math.PI/180,dd=(nh-it.h)/2;it.x=Math.round((it.x+dd*Math.sin(a))*10)/10;it.y=Math.round((it.y-dd*Math.cos(a))*10)/10;it.h=nh;}
    if(f==='p.height'&&isElev()&&it.k==='sym'&&!it.floor&&(it.stand||it.hang||isFx(it)||isCam(it)||HEIGHT_T.has(it.t))){const hh=parseHeight(v);if(hh!=null&&hh>0)it.y=-Math.round(hh);}
    if(f==='p.height')syncHeight(it,v);
    renderDiagram();renderOverlay();scheduleSave();
    if(f==='layer'){const cv=CV();if(cv.layers[v]===false){cv.layers[v]=true;}renderLayers();renderDiagram();}
    if(f==='p.src'||f==='p.height'||f==='p.mat'||f==='show'||f==='label')renderLayers();
    if(f==='p.cable'){S.cable=v;const it=SEL();if(it&&it.k==='power'){const L=v==='feeder'?'feed':it.layer==='feed'?'power':it.layer;if(L!==it.layer){it.layer=L;if(CV().layers[L]===false)CV().layers[L]=true;renderDiagram();renderLayers();scheduleSave();}}renderInspector();}
  });
  side.addEventListener('click',e=>{
    if(e.target.closest('[data-back]')){select(null);return;}
    const df=e.target.closest('[data-dfocus]');if(df){{const f=distFocus();setDistFocus(f&&f.length===1&&f[0]===df.dataset.dfocus?null:df.dataset.dfocus,true);}renderInspector();return;}
    const cb=e.target.closest('[data-col]');
    if(cb){const its=S.multi.length?selItems():(SEL()?[SEL()]:[]);if(its.length){const c=cb.dataset.col;
      mutate(()=>{its.forEach(x=>{if(c)x.col=c;else delete x.col;});});renderInspector();}return;}
    const lf=e.target.closest('[data-labfs]');
    if(lf){const d=+lf.dataset.labfs,its=S.multi.length?selItems():(SEL()?[SEL()]:[]);
      if(its.length){mutate(()=>{its.forEach(x=>{const n=d?Math.max(.6,Math.min(2.6,r1(fsOf(x)*(d>0?1.15:1/1.15)))):1;
        if(Math.abs(n-1)<.02)delete x.fs;else x.fs=n;});});renderInspector();}return;}
    const la=e.target.closest('[data-labfsall]');
    if(la){const d=+la.dataset.labfsall,pg=CV();
      if(pg){mutate(()=>{pg.items.forEach(x=>{const n=d?Math.max(.6,Math.min(2.6,r1(fsOf(x)*(d>0?1.15:1/1.15)))):1;
        if(Math.abs(n-1)<.02)delete x.fs;else x.fs=n;});});renderInspector();}return;}
    const lr=e.target.closest('[data-labrot]');if(lr){const its=S.multi.length?selItems():(SEL()?[SEL()]:[]);
      if(its.length){mutate(()=>{its.forEach(x=>{const n=((+x.cr||0)+90)%360;if(n)x.cr=n;else delete x.cr;});});renderInspector();}return;}
    const gs=e.target.closest('[data-gridsp]');if(gs){const it=SEL();if(it){mutate(()=>{it.p=it.p||{};it.p.sp=+gs.dataset.gridsp;delete it.p.sp2;});}return;}
    const a=e.target.closest('[data-act]');if(a){itemAct(a.dataset.act);return;}
    const s=e.target.closest('[data-sel]');if(s){select(s.dataset.sel);const it=SEL();if(it&&it.k==='sym'){const r=stageRect(),q=toScreen(it.x,it.y);if(q.x<0||q.y<0||q.x>r.width||q.y>r.height){const v=V();v.x=r.width/2-it.x*v.k;v.y=r.height/2-it.y*v.k;applyView();}}}
  });
  $('#selbar').addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a)itemAct(a.dataset.act);const m=e.target.closest('[data-m]');if(m){if(matchMedia('(max-width:900px)').matches)openSheet('inspect');else $('#inspSec input,#inspSec textarea')?.focus();}});
  $('#distbar').addEventListener('click',e=>{const st=e.target.closest('[data-dstep]');if(st){stepDist(+st.dataset.dstep);return;}{const da=e.target.closest('[data-dall]');if(da){setDistFocus(da.dataset.dall==='on'?null:[]);return;}}const l=e.target.closest('[data-dlist]');if(l)distListMenu(l);});
  $('#mbar').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;if(S.mOpen===b.dataset.m)closeSheets();else openSheet(b.dataset.m);});
  $$('[data-close]').forEach(b=>b.onclick=closeSheets);

  $('#side').addEventListener('input',e=>{const el=e.target;if(!el.dataset?.pair)return;const pg2=PJ()?.pages.find(x=>x.id===el.dataset.pair);if(pg2)setPair(pg2,el.value||null);});
  const doc=$('#doc');
  doc.addEventListener('focusin',()=>S.histOpen=false);
  doc.addEventListener('input',e=>{
    const el=e.target,pg=PG();if(!pg)return;
    if(!S.histOpen&&(el.dataset.pf||el.dataset.f)){pushHist();S.histOpen=true;}
    if(el.dataset.pf){pg[el.dataset.pf]=el.value;renderTabs();scheduleSave();return;}
    if(pg.type==='gear'&&gearInput(pg,el))return;
    if(el.dataset.pair){const pg2=PJ()?.pages.find(x=>x.id===el.dataset.pair);if(pg2)setPair(pg2,el.value||null);return;}
    if(el.dataset.photo){const ph=pg.photos.find(x=>x.id===el.dataset.photo);if(ph){ph[el.dataset.f==='title'?'title':'caption']=el.value;scheduleSave();}return;}
    if(el.dataset.style){const st=pg.styles.find(x=>x.id===el.dataset.style);if(st){st[el.dataset.f]=el.value;scheduleSave();}}
  });
  doc.addEventListener('change',e=>{const u=e.target.dataset.upload;if(!u)return;const files=[...e.target.files];e.target.value='';if(!files.length)return;u==='photos'?uploadPhotos(files):u==='schem'?uploadSchem(files):u==='gearpdf'?uploadGearPdfs(files):uploadStyles(files);});
  gearDnD(doc);
  if(typeof splitWire==='function')splitWire();
  doc.addEventListener('click',async e=>{
    const pg=PG();const t=e.target;
    if(t.closest('[data-act="newproj"]')){addProject(newProject());return;}
    if(!pg)return;
    if(pg.type==='schematic'&&await schemClick(pg,t))return;
    if((pg.type==='gear'||pg.type==='photos'||pg.type==='schematic')&&await gearPdfClick(pg,t))return;
    if(pg.type==='gear'&&await gearClick(pg,t))return;
    const mv=t.closest('[data-pmove]');if(mv){const i=pg.photos.findIndex(x=>x.id===mv.dataset.pmove),j=i+(+mv.dataset.d);if(j<0||j>=pg.photos.length)return;pushHist();const[x]=pg.photos.splice(i,1);pg.photos.splice(j,0,x);scheduleSave();renderDoc();return;}
    const pz=t.closest('[data-pzoom]');if(pz){openLightbox(pg,pz.dataset.pzoom);return;}
    const pdn=t.closest('[data-pdone]');if(pdn){S.pEdit.delete(pdn.dataset.pdone);S.pDone.add(pdn.dataset.pdone);renderDoc();return;}
    const pe=t.closest('[data-pedit]');if(pe){S.pDone.delete(pe.dataset.pedit);S.pEdit.add(pe.dataset.pedit);renderDoc();setTimeout(()=>$('#pt-'+pe.dataset.pedit)?.focus(),30);return;}
    const pd=t.closest('[data-pdel]');if(pd){pushHist();pg.photos=pg.photos.filter(x=>x.id!==pd.dataset.pdel);scheduleSave();renderDoc();toast('Photo removed. Undo brings it back.');return;}
    const sd=t.closest('[data-sdl]');if(sd){const st=pg.styles.find(x=>x.id===sd.dataset.sdl);zipStyles([st],safeName(st.name));return;}
    if(t.closest('[data-act="zipall"]')){zipStyles(pg.styles,safeName(PJ().name)+'-styles');return;}
    const sx=t.closest('[data-sdel]');if(sx){const st=pg.styles.find(x=>x.id===sx.dataset.sdel);if(await askConfirm('Remove style?',`“${st.name}” will be removed from this project.`,'Remove')){pushHist();pg.styles=pg.styles.filter(x=>x!==st);scheduleSave();renderDoc();}}
  });
  document.addEventListener('keydown',onKey);
  document.addEventListener('keyup',e=>{if(e.key===' ')S.space=false;});
  window.addEventListener('beforeunload',()=>{if(S.dirty)flush();});
}
function afterLayer(){if(SEL()&&CV().layers[SEL().layer]===false)S.sel=null;renderLayers();renderDiagram();renderOverlay();renderInspector();scheduleSave();}

const THEMES=['light','dark','sepia','greyd'];
const THEME_NAME={light:'Light',dark:'Dark',sepia:'Sketchbook',greyd:'Dark Grey'};
const THEME_ICON={light:'sun',dark:'moon',sepia:'book',greyd:'half'};
const THEME_DEF='greyd';
function curTheme(){const a=document.documentElement.dataset.theme;return THEMES.includes(a)?a:THEME_DEF;}
function applyTheme(t){if(t)document.documentElement.dataset.theme=t;const now=curTheme(),b=$('#themeBtn');
  b.innerHTML=I(THEME_ICON[now]);b.setAttribute('aria-label','Theme: '+THEME_NAME[now]);b.title=`Theme \u2014 ${THEME_NAME[now]}`;}
function setTheme(t){try{localStorage.setItem('plotbook.theme',t);}catch(_){}applyTheme(t);if(CV())applyView();}
function themeMenu(anchor){
  const now=curTheme();
  popMenu(anchor,[...THEMES.map(t=>({label:(t===now?'\u2713  ':'')+THEME_NAME[t],icon:THEME_ICON[t],run:()=>setTheme(t)}))]);
}
(function(){
  /* one-time: clear an old theme choice so everyone lands on the new default.
     Touches only these two keys — projects and every other setting stay put. */
  try{if(localStorage.getItem('plotbook.themereset')!=='1'){localStorage.removeItem('plotbook.theme');localStorage.setItem('plotbook.themereset','1');}}catch(_){}
  let t=null;try{t=localStorage.getItem('plotbook.theme');}catch(_){}
  if(t==='greym'||t==='greyl')t='greyd';applyTheme(THEMES.includes(t)?t:THEME_DEF);
  $('#themeBtn').onclick=()=>themeMenu($('#themeBtn'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>applyTheme());})();
function syncMbar(){const m=$('#mbar');if(!m||m.hidden)return;const r=m.getBoundingClientRect(),h=r.height?window.innerHeight-r.top:0;if(h>0)document.documentElement.style.setProperty('--mbar-h',Math.round(h)+'px');}
new ResizeObserver(syncMbar).observe($('#mbar'));window.addEventListener('resize',syncMbar);
function applyPanels(){const m=$('#main');let st={};try{st=JSON.parse(localStorage.getItem('plotbook.panels')||'{}');}catch(_){}
  m.classList.toggle('noL',!!st.l);m.classList.toggle('noR',!!st.r);
  $('#togL').innerHTML=I(st.l?'right':'left');$('#togL').setAttribute('aria-label',st.l?'Show library':'Hide library');$('#togL').title=st.l?'Show library':'Hide library';
  $('#togR').innerHTML=I(st.r?'left':'right');$('#togR').setAttribute('aria-label',st.r?'Show layers and details':'Hide layers and details');$('#togR').title=st.r?'Show layers and details':'Hide layers and details';}
function togglePanel(k){let st={};try{st=JSON.parse(localStorage.getItem('plotbook.panels')||'{}');}catch(_){}st[k]=!st[k];try{localStorage.setItem('plotbook.panels',JSON.stringify(st));}catch(_){}S.panels=st;const w=$('#stageWrap'),x0=w.hidden?null:w.getBoundingClientRect().left;applyPanels();if(x0!=null){const dx=x0-w.getBoundingClientRect().left;if(dx){for(const v of Object.values(S.views))v.x+=dx;if(CV())applyView();}}}
$('#togL').onclick=()=>togglePanel('l');$('#togR').onclick=()=>togglePanel('r');applyPanels();
wire();
boot();
})();
